services:
  web:
    image: nginx:latest
    container_name: nginx-web
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "3000:80"
    restart: always
    networks:
      - gestionlogiciel_default

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    volumes:
      - ./Data/config/mainKeycloak:/opt/keycloak/data/import
    ports:
      - "8080:8080"
    restart: always
    networks:
      - gestionlogiciel_default
  
  fuseki-fed:
    image: stain/jena-fuseki
    container_name: fuseki-fed
    ports:
      - "3030:3030"
    environment:
      - ADMIN_PASSWORD=admin
      - FUSEKI_DATASET_1=dataset
      - FUSEKI_DATASET_1_TYPE=mem
      #- JAVA_OPTIONS=-Dhttp.proxyHost=forward-proxy -Dhttp.proxyPort=8888 -Dhttp.nonProxyHosts=localhost|127.0.0.1|fuseki-fed
      - JVM_ARGS=-Dhttp.proxyHost=forward-proxy -Dhttp.proxyPort=8888 -Dhttp.nonProxyHosts="localhost|127.0.0.1|fuseki-fed"
      # configuré le conteneur Fuseki avec des arguments JVM standards
      # pour dire à Fuseki : "Pour toutes tes sorties vers Internet ou les hôpitaux, ne sors pas directement, 
      # passe obligatoirement par le guichet 'forward-proxy
    networks:
      - gestionlogiciel_default

  fedup:
    image: aadamec/fedup-capstone:v10
    container_name: fedup-server
    ports:
      - "3330:3330"
    restart: always
    networks:
      - gestionlogiciel_default
    #environment:
    #  - JAVA_OPTS=-Dhttp.proxyHost=forward-proxy -Dhttp.proxyPort=8888 -Dhttp.nonProxyHosts="localhost|127.0.0.1|fuseki-fed"

  
  forward-proxy:
    build:
      context: ./forward-proxy
      dockerfile: Dockerfile
    container_name: forward-proxy
    ports:
      - "8888:8888"
    networks:
      - gestionlogiciel_default
    volumes:
      - ./forward-proxy/forward-proxy.js:/app/forward-proxy.js

networks:
  gestionlogiciel_default:
    name: gestionlogiciel_default
    driver: bridge
