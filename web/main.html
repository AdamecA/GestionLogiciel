<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <title>Page Principale</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="container">
    <h1 id="welcome-message">Chargement...</h1>
    <pre id="roles-display"></pre>

    <div class="query-section">
        <div class="examples">
            <button class="example-btn" onclick="chargerExemple(1)">Exemple 1</button>
            <button class="example-btn" onclick="chargerExemple(2)">Exemple 2</button>
            <button class="example-btn" onclick="chargerExemple(3)">Exemple 3</button>
        </div>

        <textarea id="sparql-query" placeholder="Requête SPARQL"></textarea>
    </div>

    <button id="submit-btn" type="button">Submit</button>
    <div id="results-container" class="results"></div>
</div>

<script>
    // ─────────────────────────────────────────────
    //  Authentification & Token
    // ─────────────────────────────────────────────
    async function getToken(code) {
        const url = 'http://localhost:8080/realms/myrealm/protocol/openid-connect/token';
        const params = new URLSearchParams();
        params.append('grant_type', 'authorization_code');
        params.append('client_id', 'webapp');
        params.append('code', code);
        params.append('redirect_uri', 'http://localhost:3000/main.html');

        try {
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: params
            });
            if (!response.ok) throw new Error('Erreur récupération token');
            return await response.json();
        } catch (err) {
            console.error(err);
            return null;
        }
    }

    function parseJwt(token) {
        const base64Url = token.split('.')[1];
        const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
        const jsonPayload = decodeURIComponent(
            atob(base64)
                .split('')
                .map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2))
                .join('')
        );
        return JSON.parse(jsonPayload);
    }

    function filtrerRoles(roles) {
        const rolesASupprimer = ['offline_access', 'uma_authorization'];
        return roles.filter(r => !rolesASupprimer.includes(r));
    }
    
    // ─────────────────────────────────────────────
    // Envoi de la requête au Fuseki fédérateur
    // ─────────────────────────────────────────────
    async function sendQuery(query) {
        const fusekiGlobalUrl = "http://localhost:3030/dataset/query";

        try {
            const response = await fetch(fusekiGlobalUrl, {
                method: "POST",
                headers: {
                    "Content-Type": "application/sparql-query"
                },
                body: query
            });

            if (!response.ok) {
                const errText = await response.text();
                throw new Error(`Erreur Fuseki Global (${response.status}) — ${errText}`);
            }

            const text = await response.text();
            afficherResultats([{ endpoint: fusekiGlobalUrl, result: text }]);
        } catch (err) {
            console.error("Erreur sendQuery :", err);
            alert(err.message);
        }
    }

    // ─────────────────────────────────────────────
    //  Affichage des résultats dans la page
    // ─────────────────────────────────────────────
    function afficherResultats(results) {
        const mergedBindings = results.flatMap(r => {
            try {
                const json = typeof r.result === "string" ? JSON.parse(r.result) : r.result;
                return json?.results?.bindings || [];
            } catch (e) {
                console.error("Erreur parsing JSON:", e);
                return [];
            }
        });

        const container = document.getElementById("results-container");
        container.innerHTML = ""; // On vide avant chaque affichage

        if (mergedBindings.length === 0) {
            container.innerHTML = "<p>Aucun résultat trouvé.</p>";
            return;
        }

        const allVars = Object.keys(mergedBindings[0] || {});

        let html = `
        <h3>Résultats de la requête</h3>
        <table style="border-collapse:collapse;width:100%;text-align:left">
            <thead>
                <tr style="background-color:#007bff;color:white">
                    ${allVars.map(v => `<th style="padding:6px">${v}</th>`).join('')}
                </tr>
            </thead>
            <tbody>
        `;

        mergedBindings.forEach(binding => {
            html += "<tr>";
            allVars.forEach(v => {
                const val = binding[v]?.value || "—";
                html += `<td style="padding:6px;border-bottom:1px solid #ddd">${val}</td>`;
            });
            html += "</tr>";
        });

        html += `</tbody></table>`;
        container.innerHTML = html;
    }

    // ─────────────────────────────────────────────
    // Initialisation de la page
    // ─────────────────────────────────────────────
    async function main() {
        const params = new URLSearchParams(window.location.search);
        const code = params.get('code');
        if (!code) return window.location.href = 'index.html';

        const tokenData = await getToken(code);
        if (!tokenData || !tokenData.access_token) return window.location.href = 'index.html';

        await fetch("http://localhost:8888/store-token", {
            method: "POST",
            headers: {
                "X-Token": tokenData.access_token
            }
        });

        const payload = parseJwt(tokenData.access_token);
        console.log("Token payload:", payload);

        const nom = payload.preferred_username || payload.name || "Utilisateur";
        const userRealmRoles = filtrerRoles((payload.realm_access && payload.realm_access.roles) || []);

        document.getElementById('welcome-message').textContent = `Bonjour ${nom} !`;
        document.getElementById('roles-display').textContent =
            `Rôles : ${userRealmRoles.join(', ') || 'Aucun'}`;

        document.getElementById('submit-btn').addEventListener('click', () => {
            const requete = document.getElementById('sparql-query').value.trim();
            if (!requete) {
                alert("Veuillez saisir une requête avant de soumettre !");
                return;
            }

            // Efface les anciens résultats
            document.getElementById("results-container").innerHTML = "";

            sendQuery(requete);
        });
    }

    // ─────────────────────────────────────────────
    // Chargement des exemples prédéfinis
    // ─────────────────────────────────────────────
    async function chargerExemple(num) {
        try {
            const response = await fetch(`/Resources/queryExemple/exemple${num}.sparql`);
            if (!response.ok) throw new Error(`Erreur lors du chargement de l'exemple ${num}`);
            const requete = await response.text();
            document.getElementById('sparql-query').value = requete;
        } catch (err) {
            alert(err.message);
        }
    }

    main();
</script>
</body>
</html>
