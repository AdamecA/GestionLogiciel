events {
    worker_connections 1024;
}

http {
    upstream fuseki {
        server fuseki-hospital-a:3030;
    }
    
    upstream keycloak {
        server keycloak:8090;
    }
    
    server {
        listen 80;
        
        location /health {
            return 200 "OK\n";
        }
        
        location /hospital-a/query {
            # Validate with safe-kg realm (where token was issued)
            auth_request /validate;
            
            # If validation passes, forward to Fuseki
            proxy_pass http://fuseki/hospital-a/query;
            proxy_set_header Authorization $http_authorization;
        }
        
        location = /validate {
            internal;
            
            set $token "";
            if ($http_authorization ~* "Bearer\s+(.+)") {
                set $token $1;
            }
            
            # Validate with safe-kg realm
            # Hospital A trusts safe-kg via Identity Provider
            proxy_pass http://keycloak/realms/safe-kg/protocol/openid-connect/userinfo;
            proxy_method GET;
            proxy_set_header Authorization "Bearer $token";
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
        }

        location = /test-validate {
            # Public endpoint to test validation
            proxy_pass http://keycloak/realms/safe-kg/protocol/openid-connect/userinfo;
            proxy_method GET;
            proxy_set_header Authorization $http_authorization;
        }
    }
}